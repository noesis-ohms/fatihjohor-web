<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Hubungan kesihatan metabolik dengan kesihatan lelaki</title>
  <desc id="desc">Ilustrasi pendidikan yang menunjukkan visceral fat di abdomen, salur darah, hormon, prostat dan folikel rambut sebagai domain yang boleh saling berkait melalui faktor metabolik dan vaskular.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f9ff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient>
    <linearGradient id="torso" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9e7f7"/><stop offset="1" stop-color="#bdd5ee"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0a3466" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="720" rx="40" fill="url(#bg)"/>
  <text x="60" y="70" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#0b2d57">Satu badan, beberapa sistem yang saling berkait</text>
  <text x="60" y="105" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#4b6380">Ilustrasi pendidikan — hubungan sebenar berbeza mengikut individu dan memerlukan penilaian klinikal.</text>

  <!-- male torso -->
  <g transform="translate(430 130)" filter="url(#shadow)">
    <circle cx="170" cy="58" r="47" fill="url(#torso)" stroke="#7899ba" stroke-width="4"/>
    <path d="M116 120 C75 133 52 181 52 240 L70 430 C74 474 96 513 132 538 L208 538 C244 513 266 474 270 430 L288 240 C288 181 265 133 224 120 C205 134 190 141 170 141 C150 141 135 134 116 120Z" fill="url(#torso)" stroke="#7899ba" stroke-width="4"/>
    <path d="M87 186 C54 218 27 278 18 361" fill="none" stroke="#7899ba" stroke-width="24" stroke-linecap="round" opacity=".9"/>
    <path d="M253 186 C286 218 313 278 322 361" fill="none" stroke="#7899ba" stroke-width="24" stroke-linecap="round" opacity=".9"/>
    <!-- abdomen / visceral fat -->
    <ellipse cx="170" cy="338" rx="78" ry="92" fill="#f3b04f" opacity=".50" stroke="#db8a18" stroke-width="4"/>
    <text x="170" y="330" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#7a4500">Visceral fat</text>
    <text x="170" y="350" text-anchor="middle" font-family="Arial" font-size="13" fill="#7a4500">pinggang / abdomen</text>
    <!-- vascular pathway -->
    <path d="M170 158 C176 230 150 280 160 390 C164 440 183 468 192 510" fill="none" stroke="#d74949" stroke-width="10" stroke-linecap="round"/>
    <path d="M170 210 C145 226 130 250 124 278" fill="none" stroke="#2474b8" stroke-width="7" stroke-linecap="round"/>
    <!-- prostate -->
    <ellipse cx="170" cy="455" rx="27" ry="18" fill="#5c4b9b" opacity=".9"/>
    <circle cx="170" cy="430" r="18" fill="#dbe7f5" stroke="#5c4b9b" stroke-width="3"/>
  </g>

  <!-- Callouts left -->
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="55" y="155" width="310" height="115" rx="22" fill="#fff" stroke="#cfe0f2"/>
    <circle cx="94" cy="194" r="20" fill="#f5a623"/><text x="94" y="201" text-anchor="middle" font-size="22" fill="#fff">1</text>
    <text x="126" y="190" font-size="21" font-weight="700" fill="#0b2d57">Visceral fat</text>
    <text x="126" y="218" font-size="15" fill="#536b85">Lemak abdomen sering bergerak bersama</text>
    <text x="126" y="239" font-size="15" fill="#536b85">risiko gula, tekanan darah &amp; lipid.</text>

    <rect x="55" y="305" width="310" height="115" rx="22" fill="#fff" stroke="#cfe0f2"/>
    <circle cx="94" cy="344" r="20" fill="#d74949"/><text x="94" y="351" text-anchor="middle" font-size="22" fill="#fff">2</text>
    <text x="126" y="340" font-size="21" font-weight="700" fill="#0b2d57">Salur darah</text>
    <text x="126" y="368" font-size="15" fill="#536b85">Kesihatan vaskular penting untuk jantung,</text>
    <text x="126" y="389" font-size="15" fill="#536b85">otak dan fungsi ereksi.</text>

    <rect x="55" y="455" width="310" height="115" rx="22" fill="#fff" stroke="#cfe0f2"/>
    <circle cx="94" cy="494" r="20" fill="#2f87c7"/><text x="94" y="501" text-anchor="middle" font-size="22" fill="#fff">3</text>
    <text x="126" y="490" font-size="21" font-weight="700" fill="#0b2d57">Hormon</text>
    <text x="126" y="518" font-size="15" fill="#536b85">Tenaga, tidur, berat badan dan simptom</text>
    <text x="126" y="539" font-size="15" fill="#536b85">seksual perlu dinilai dalam konteks.</text>

    <!-- Callouts right -->
    <rect x="835" y="205" width="310" height="115" rx="22" fill="#fff" stroke="#cfe0f2"/>
    <circle cx="874" cy="244" r="20" fill="#5c4b9b"/><text x="874" y="251" text-anchor="middle" font-size="22" fill="#fff">4</text>
    <text x="906" y="240" font-size="21" font-weight="700" fill="#0b2d57">Prostat</text>
    <text x="906" y="268" font-size="15" fill="#536b85">Aliran kencing, kerap malam dan rasa</text>
    <text x="906" y="289" font-size="15" fill="#536b85">tidak puas kencing perlu dinilai.</text>

    <rect x="835" y="365" width="310" height="115" rx="22" fill="#fff" stroke="#cfe0f2"/>
    <circle cx="874" cy="404" r="20" fill="#305b3c"/><text x="874" y="411" text-anchor="middle" font-size="22" fill="#fff">5</text>
    <text x="906" y="400" font-size="21" font-weight="700" fill="#0b2d57">Folikel rambut</text>
    <text x="906" y="428" font-size="15" fill="#536b85">Corak genetik, keradangan, nutrisi dan</text>
    <text x="906" y="449" font-size="15" fill="#536b85">perubahan sistemik boleh mempengaruhi rambut.</text>

    <rect x="835" y="525" width="310" height="115" rx="22" fill="#0b2d57"/>
    <text x="870" y="566" font-size="20" font-weight="700" fill="#fff">Idea utama</text>
    <text x="870" y="594" font-size="15" fill="#dce9f7">Jangan rawat satu simptom secara terasing.</text>
    <text x="870" y="616" font-size="15" fill="#dce9f7">Lihat risiko metabolik, tidur, gaya hidup</text>
    <text x="870" y="638" font-size="15" fill="#dce9f7">dan simptom lelaki sebagai satu gambaran.</text>
  </g>

  <!-- connector lines -->
  <g stroke="#9bb6d0" stroke-width="3" fill="none" stroke-dasharray="7 7">
    <path d="M365 212 C420 228 454 286 503 330"/>
    <path d="M365 362 C442 360 498 351 560 339"/>
    <path d="M365 510 C432 486 480 463 538 424"/>
    <path d="M835 262 C778 286 720 388 630 448"/>
    <path d="M835 422 C770 405 715 333 642 198"/>
  </g>
</svg>
